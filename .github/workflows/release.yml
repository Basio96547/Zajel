name: Release

# Builds a signed release APK and publishes it as a GitHub Release whenever a
# version tag is pushed. UpdateChecker (app/src/main/java/.../update/) polls
# exactly this repo's "latest release" for exactly this asset, so a tag here
# IS what ships an update to anyone who taps "install" in the app — pushing
# v1.2.3 is the whole release process, not just a source snapshot.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Resolve version from tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run JVM unit tests
        run: ./gradlew test --console=plain

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --console=plain \
            -PreleaseVersionName=${{ steps.version.outputs.name }} \
            -PreleaseVersionCode=${{ github.run_number }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f release.jks

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: زاجل ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
